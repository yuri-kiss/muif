parser: babel

useTabs: false
tabWidth: 2
endOfLine: lf
printWidth: 180

semi: true
singleQuote: true
trailingComma: all

bracketSpacing: true
bracketSameLine: true

arrowParens: always

singleAttributePerLine: true
objectWrap: collapse
quoteProps: consistent
proseWrap: preserve

# Ignorable
vueIndentScriptAndStyle: false
cursorOffset: -1
embeddedLanguageFormatting: off
experimentalTernaries: false
experimentalOperatorPosition: end
jsxSingleQuote: true
htmlWhitespaceSensitivity: css
insertPragma: false
checkIgnorePragma: true
requirePragma: false
